[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asimtool"
version = "0.1.0"
description = "AI-powered developer & language toolkit — grammar, translation, quizzes, bug reports, PR reviews, trip planning, and more."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Asim Zorlu", email = "asimzorlu@gmail.com"},
]
keywords = [
    "ai", "g4f", "grammar", "translation", "quiz", "developer-tools",
    "bug-report", "test-cases", "code-review", "trip-planner", "solar",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Education",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "g4f>=0.3.0",
    "requests>=2.28",
    "feedparser>=6.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=3.0"]
language = ["langdetect>=1.0"]
all = [
    "pypdf>=3.0",
    "langdetect>=1.0",
]

[project.urls]
Homepage = "https://github.com/asimptot/asimtool"
Repository = "https://github.com/asimptot/asimtool"
Issues = "https://github.com/asimptot/asimtool/issues"

[tool.setuptools.packages.find]
include = ["asimtool*"]
